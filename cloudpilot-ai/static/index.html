
<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CloudPilot AI</title><style>
*{box-sizing:border-box}body{margin:0;background:#212121;color:#eee;font:15px Arial}.app{display:flex;min-height:100vh}.side{width:235px;background:#171717;padding:18px}.brand{font-size:19px;font-weight:bold;margin-bottom:20px}.new{width:100%;padding:12px;background:transparent;color:#eee;border:1px solid #555;border-radius:10px;text-align:left}.main{flex:1;display:flex;flex-direction:column;min-width:0}.top{padding:17px 24px;border-bottom:1px solid #383838}.chat{width:min(850px,100%);margin:auto;padding:24px 18px 145px;flex:1}.welcome{text-align:center;margin:15vh 0}.msg{white-space:pre-wrap;line-height:1.55;padding:15px 18px;margin:16px 0;border-radius:14px}.user{background:#303030;margin-left:auto;width:fit-content;max-width:85%}.assistant{background:transparent}.activity,.preview{border:1px solid #555;border-radius:10px;padding:12px;margin:12px 0;overflow-wrap:anywhere}.preview{border-color:#a17b36;background:#2b261c}.composerWrap{position:fixed;bottom:0;left:235px;right:0;background:linear-gradient(transparent,#212121 25%);padding:18px}.composer{width:min(850px,100%);margin:auto;display:flex;gap:8px;background:#303030;border:1px solid #555;border-radius:16px;padding:10px}textarea{flex:1;min-height:42px;max-height:150px;resize:vertical;background:transparent;color:white;border:0;outline:0;font:inherit}.send,.confirm{background:#10a37f;color:white;border:0;border-radius:9px;padding:10px 16px;cursor:pointer}.hint{text-align:center;color:#aaa;font-size:11px;margin:8px}@media(max-width:650px){.side{width:65px;padding:10px}.brand{font-size:0}.brand:after{content:"CP";font-size:18px}.new{font-size:0}.new:after{content:"+";font-size:20px}.composerWrap{left:65px}}
</style></head><body><div class="app"><aside class="side"><div class="brand">☁ CloudPilot AI</div><button class="new" id="new">＋ New chat</button><p style="color:#aaa;font-size:12px;margin-top:35px">AWS assistant<br>ap-south-1 Mumbai<br>Approval required for writes</p></aside><main class="main"><div class="top">CloudPilot AI · AWS Assistant</div><section class="chat" id="chat"><div class="welcome" id="welcome"><h1>What can I help you build?</h1><p style="color:#aaa">EC2 · VPC · Subnets · Security Groups · S3 · RDS · Lambda · CloudWatch</p></div></section></main></div>
<div class="composerWrap"><form class="composer" id="form"><textarea id="prompt" placeholder="Message CloudPilot AI..." required></textarea><button class="send" id="send">↑</button></form><div class="hint">AWS write actions need your confirmation. Charges may apply.</div></div>
<script>
const chat=document.getElementById('chat'),box=document.getElementById('prompt');let history=[];
function bubble(role,text){let d=document.createElement('div');d.className='msg '+role;d.textContent=text;chat.appendChild(d);return d}
function approval(x){if(!x?.requires_approval)return;let d=document.createElement('div');d.className='preview';let p=document.createElement('pre');p.textContent='Review AWS action:\\n'+JSON.stringify(x.preview,null,2)+'\\nPotential AWS charges.';d.appendChild(p);let b=document.createElement('button');b.className='confirm';b.textContent='Confirm action';b.onclick=async()=>{b.disabled=true;b.textContent='Executing...';try{let r=await fetch('/api/approve',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({approval_id:x.approval_id})});let j=await r.json();bubble('assistant',r.ok?'AWS result:\\n'+JSON.stringify(j.result,null,2):'Failed: '+(j.detail||JSON.stringify(j)))}catch(e){bubble('assistant','Network error: '+e.message)}b.remove()};d.appendChild(b);chat.appendChild(d)}
document.getElementById('form').onsubmit=async e=>{e.preventDefault();let text=box.value.trim();if(!text)return;document.getElementById('welcome')?.remove();bubble('user',text);box.value='';let wait=bubble('assistant','Thinking…');document.getElementById('send').disabled=true;try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:text,history})});let j=await r.json();wait.textContent=r.ok?(j.answer||'No answer'):('Error: '+(j.detail||JSON.stringify(j)));if(j.activity?.length){let d=document.createElement('details');d.className='activity';let s=document.createElement('summary');s.textContent='Tool activity ('+j.activity.length+')';d.appendChild(s);let pre=document.createElement('pre');pre.textContent=JSON.stringify(j.activity,null,2);d.appendChild(pre);chat.appendChild(d);j.activity.forEach(a=>approval(a.result))}history.push({role:'user',content:text},{role:'assistant',content:wait.textContent});history=history.slice(-10)}catch(err){wait.textContent='Network error: '+err.message}finally{document.getElementById('send').disabled=false}};
document.getElementById('new').onclick=()=>{chat.innerHTML='<div class="welcome" id="welcome"><h1>What can I help you build?</h1><p style="color:#aaa">Ask about AWS resources.</p></div>';history=[]};
box.onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();document.getElementById('form').requestSubmit()}};
</script></body></html>
